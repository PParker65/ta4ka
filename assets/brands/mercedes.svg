      <stop stop-color="#F7F8FA"/>
      <stop offset="0.4" stop-color="#C5C9D0"/>
      <stop offset="0.72" stop-color="#8B9098"/>
      <stop offset="1" stop-color="#E6E8EC"/>
    </linearGradient>
    <linearGradient id="mbzStar" x1="60" y1="16" x2="60" y2="86" gradientUnits="userSpaceOnUse">
