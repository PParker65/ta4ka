<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- BMW roundel · blue / white quarters + ring (classic mark still used 2026) -->
  <circle cx="60" cy="60" r="56" fill="#1C1C1C"/>
  <circle cx="60" cy="60" r="52" fill="#FFFFFF"/>
  <circle cx="60" cy="60" r="48" fill="#1C1C1C"/>
  <!-- Quarters -->
  <path d="M60 16 A44 44 0 0 1 104 60 L60 60 Z" fill="#0066B1"/>
  <path d="M104 60 A44 44 0 0 1 60 104 L60 60 Z" fill="#FFFFFF"/>
  <path d="M60 104 A44 44 0 0 1 16 60 L60 60 Z" fill="#0066B1"/>
  <path d="M16 60 A44 44 0 0 1 60 16 L60 60 Z" fill="#FFFFFF"/>
  <!-- Outer letter ring -->
  <circle cx="60" cy="60" r="50" fill="none" stroke="#1C1C1C" stroke-width="8"/>
  <circle cx="60" cy="60" r="46" fill="none" stroke="#FFFFFF" stroke-width="1.2"/>
  <!-- BMW letters (simplified positions on ring) -->
  <text x="60" y="28" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="1">BMW</text>
  <circle cx="60" cy="60" r="1.5" fill="#1C1C1C"/>
</svg>
