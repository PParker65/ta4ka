name: autoservice
description: Багатомовна CRM-система автосервісу (заміна майстра-приймача).
publish_to: "none"
version: 1.0.71+71

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.8.1
  flutter_riverpod: ^2.6.1
  sqlite3: ^2.7.5
  sqlite3_flutter_libs: ^0.5.32
  dio: ^5.8.0
  image_picker: ^1.1.2
  file_picker: ^8.1.7
  path_provider: ^2.1.5
  path: ^1.9.1
  intl: any
  model_viewer_plus: ^1.9.3
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.7.0
  webview_flutter_wkwebview: ^3.22.0
  connectivity_plus: ^6.1.4
  flutter_svg: ^2.0.17
  video_player: ^2.14.0
  geolocator: ^13.0.4
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/categories/
    - assets/scenes/
    - assets/feed/
    - assets/brands/
    - assets/usa/
    - assets/shops/
    - assets/brand/
    - assets/models/
